description: >-
  Honest zero. Fiddler publishes NO rate limits, quotas, throttling windows or
  rate-limit response headers for any of its interfaces. REPLACES a 2026-05-04
  bulk-sweep scaffold that asserted an X-RateLimit-* header family, a 429
  throttling response and per-tier requests-per-minute figures — none of which
  Progress Telerik has ever published. Those values were invented by the sweep,
  not read from the provider.
limits: []
limit_count: 0
