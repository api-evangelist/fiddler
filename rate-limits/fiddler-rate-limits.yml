responseCodes: {}
searched:
  - url: https://www.telerik.com/fiddler/fiddler-everywhere/documentation/agent-tools/fiddler-mcp-server
    status: 200
    finding: >-
      The MCP server reference documents authentication, tools, sanitization and
      an admin kill switch. No request quota, throttle, window or rate-limit
      header is documented.
  - url: https://www.telerik.com/purchase/fiddler
    status: 200
    finding: >-
      Plans are priced per named user per month with "unlimited capturing
      capabilities" on every tier. Nothing is metered by request, so there is no
      rate-limit surface to publish.
note: >-
  Structural reason for the zero: Fiddler's only programmatic interface is a
  loopback MCP server bound to the developer's own machine
  (http://localhost:8868/mcp). There is no shared multi-tenant endpoint to
  protect, so the absence of published limits is expected rather than a gap.
  Gating is by LICENCE (Pro or higher) and by an administrator DisableMCP policy,
  not by throughput.
