apis:
  - aid: fiddler:fiddler-everywhere
    name: Fiddler Everywhere
    description: >-
      Fiddler Everywhere is a cross-platform web debugging proxy for macOS,
      Windows, and Linux. It captures HTTP and HTTPS traffic, provides API
      composition capabilities, and includes collaboration features for team
      debugging and API testing workflows.
    humanURL: https://www.telerik.com/fiddler/fiddler-everywhere
    tags:
      - API Testing
      - Cross Platform
      - HTTP Debugging
      - Traffic Capture
    tags_raw:
      - API Testing
      - Cross Platform
      - HTTP Debugging
      - Traffic Capture
    properties:
      - type: Documentation
        url: https://docs.telerik.com/fiddler-everywhere/introduction
      - type: GettingStarted
        url: >-
          https://www.telerik.com/fiddler/fiddler-everywhere/documentation/installation-and-setup/quickstart-windows
      - type: Download
        url: https://www.telerik.com/download/fiddler-everywhere
  - aid: fiddler:fiddler-everywhere-mcp
    name: Fiddler Everywhere MCP Server
    description: >-
      The Fiddler Everywhere MCP server is the only programmatic interface
      Progress Telerik publishes for Fiddler. It is hosted by the desktop
      application on the loopback interface at http://localhost:8868/mcp over
      streamable HTTP, authenticated with an API key generated in Settings >
      MCP Server, and gated to the Pro and Enterprise tiers. It exposes 20
      documented tools covering status and login, browser/terminal/network
      capture, session retrieval and filtering, traffic-rewriting rules,
      reverse-proxy configuration and LLM agent-call caching. Because the
      endpoint is loopback-bound it is not reachable by a remote agent: a person
      must install, license and sign in to Fiddler Everywhere first.
    humanURL: >-
      https://www.telerik.com/fiddler/fiddler-everywhere/documentation/agent-tools/fiddler-mcp-server
    baseURL: http://localhost:8868/mcp
    baseURL_note: >-
      Recorded as loopback deliberately. This is the real, provider-documented
      base for the server; there is no hosted host to substitute, and putting a
      telerik.com host here would name an endpoint that does not exist.
    tags:
      - MCP
      - Agent Tooling
      - HTTP Debugging
      - Traffic Capture
    tags_raw:
      - Model Context Protocol
      - Agent Tooling
      - HTTP Debugging
      - Traffic Capture
    properties:
      - type: MCPServer
        url: mcp/fiddler-mcp.yml
      - type: APIReference
        url: >-
          https://www.telerik.com/fiddler/fiddler-everywhere/documentation/agent-tools/fiddler-mcp-server
      - type: AgentSkill
        url: skills/_index.yml
      - type: Authentication
        url: authentication/fiddler-authentication.yml
      - type: Conventions
        url: conventions/fiddler-conventions.yml
  - aid: fiddler:fiddler-classic
    name: Fiddler Classic
    description: >-
      Fiddler Classic is the original free Windows-based HTTP debugging proxy
      for logging all HTTP and HTTPS traffic between a computer and the
      Internet. It supports traffic inspection, breakpoints, and extensibility
      through FiddlerScript and extensions. As of 2026-08-03 it is licensed for
      non-commercial use only; commercial users were given 45 days to move to
      Fiddler Everywhere, with commercial use unsupported after 2026-09-17.
    humanURL: https://www.telerik.com/fiddler/fiddler-classic
    tags:
      - Free Tool
      - HTTP Debugging
      - Traffic Logging
      - Windows
    properties:
      - type: Documentation
        url: https://docs.telerik.com/fiddler/configure-fiddler/tasks/configurefiddler
      - type: Download
        url: https://www.telerik.com/download/fiddler
      - type: Deprecation
        url: https://www.telerik.com/purchase/license-agreement/fiddler
  - aid: fiddler:fiddlercore
    name: FiddlerCore
    description: >-
      FiddlerCore is the embeddable Fiddler proxy engine for .NET and .NET
      Standard applications, licensed and delivered as a download rather than
      through a public package registry. Two first-party helper libraries
      (FiddlerCore5.NetworkConnections and BCMakeCert) are published on NuGet by
      Progress, both last released 2023-03-14.
    humanURL: https://www.telerik.com/fiddlercore
    tags:
      - Embeddable Proxy
      - .NET
      - SDK
      - Traffic Capture
    properties:
      - type: Documentation
        url: https://www.telerik.com/support/fiddlercore
      - type: SDKs
        url: packages/fiddler-packages.yml
  - aid: fiddler:fiddler-jam
    name: Fiddler Jam
    description: >-
      RETIRED. Fiddler Jam was a browser-based troubleshooting solution that let
      non-technical users capture HTTP traffic logs and share them with
      development teams. Progress Software discontinued it on 2024-07-01, closed
      the portal and deleted all recordings on 2024-12-01, and states it is "no
      longer a part of the Progress Software portfolio in any way". Its former
      product page and documentation both return 404; the retirement notice on
      the purchase page is the only surviving surface. Kept in this profile so
      the retirement is on the record rather than the product silently
      vanishing.
    humanURL: https://www.telerik.com/purchase/fiddler-jam
    lifecycle: retired
    retired: '2024-07-01'
    tags:
      - Browser Extension
      - Collaboration
      - Retired
      - Troubleshooting
    properties:
      - type: Deprecation
        url: https://www.telerik.com/purchase/fiddler-jam
