aid: fiddler
name: Fiddler
description: >-
  Fiddler by Telerik (Progress Software) is a family of HTTP debugging proxy
  tools for capturing, inspecting, modifying, and replaying HTTP and HTTPS
  traffic between a machine and the internet. The line comprises Fiddler
  Everywhere (the cross-platform flagship), Fiddler Classic (the original
  Windows proxy, licensed for non-commercial use only as of 2026-08-03),
  Fiddler Everywhere Reporter (a free capture-and-report companion) and
  FiddlerCore (an embeddable proxy engine for .NET). Fiddler publishes no
  hosted REST API; its programmatic surface is a first-party Model Context
  Protocol server hosted by the Fiddler Everywhere desktop app on the loopback
  interface, exposing 20 documented tools that let a coding agent start
  captures, read sessions and request/response details, apply filters, create
  traffic-rewriting rules, run a reverse proxy and cache LLM agent calls.
  Progress also publishes three official Agent Skills for it. Fiddler Jam was
  retired by Progress on 2024-07-01.
